name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  vectorgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- --workload w2 --n 5000 --setup-n 1000 --out /tmp/ci-w2
        working-directory: tools/vectorgen
      - run: test -s /tmp/ci-w2.run.cmd.jsonl && head -1 /tmp/ci-w2.run.cmd.jsonl | grep -q matcher-vector

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # every manifest entry must have both .cmd.jsonl and .evt.jsonl on disk
      - run: |
          python3 - <<'EOF'
          import json, os, sys
          mf = json.load(open('vectors/manifest.json'))
          missing = []
          for v in mf['vectors']:
              for ext in ('.cmd.jsonl', '.evt.jsonl'):
                  p = os.path.join('vectors', v['file'] + ext)
                  if not os.path.isfile(p):
                      missing.append(p)
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print(f"{len(mf['vectors'])} vectors complete")
          EOF
