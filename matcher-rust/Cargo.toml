[package]
name = "matcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Deterministic, zero-allocation FIFO limit order book and matching engine core"
license = "MIT OR Apache-2.0"
keywords = ["matching-engine", "order-book", "exchange", "lob", "hft"]
categories = ["algorithms", "data-structures"]
authors = ["Abhijit Kumar <abhijitkrm@gmail.com>"]
repository = "https://github.com/abhijitkrm/matcher"
homepage = "https://github.com/abhijitkrm/matcher"
readme = "README.md"
exclude = ["/vectors", "/bench"]

[dependencies]

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
